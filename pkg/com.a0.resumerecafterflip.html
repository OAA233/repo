<h1>Camera Resume Rec</h1>
<p class="tagline">0.8.0 · wangyuan</p>

<div class="prose"><p>系统相机录像中双击翻转会打断录像（错误 -11818）。本插件在被打断后自动续录，并在你按停止时把各分段无损拼成一个完整视频写入相册，原分段自动清理。</p>
<ul>
<li>录像中翻转不再丢后半段</li>
<li>输出是单个完整视频，不是几段碎片</li>
<li>原分段清理干净，不会在相册里堆垃圾</li>
</ul></div>
